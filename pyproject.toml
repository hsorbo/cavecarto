[build-system]
requires = ["scikit-build-core[pyproject]>=0.7.0", "pybind11", "setuptools_scm[toml]>=8"]  # pybind11 not used but unblocks some wheels
build-backend = "scikit_build_core.build"

[project]
name = "pycavecarto"
dynamic = ["version"]
description = "Python bindings for the cavecarto C library"
authors = [{name = "Håvard Sørbø", email = "havard@hsorbo.no"}]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: OS Independent"
]
requires-python = ">=3.7"

[tool.scikit-build]
wheel.packages = ["python/cavecarto"]  # points to your pure Python code
build-dir = "python_build"                    # optional: where to build

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
